<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 800">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glassPane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0c4a6e" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cabinHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#3f0d0d"/>
    </linearGradient>
    <linearGradient id="cabinRoom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2c2c"/>
      <stop offset="1" stop-color="#5c1a1a"/>
    </linearGradient>
    <linearGradient id="obsHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1f4d"/>
    </linearGradient>
    <linearGradient id="obsFloor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2a52"/>
      <stop offset="1" stop-color="#173a6e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.6" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.65"/>
    </radialGradient>
    <g id="bunk">
      <rect x="-28" y="-38" width="56" height="76" rx="6" fill="#78350f" stroke="#fde68a" stroke-width="1.5" opacity="0.9"/>
      <line x1="-20" y1="-22" x2="20" y2="-22" stroke="#fde68a" stroke-width="2" opacity="0.7"/>
      <line x1="-20" y1="-4" x2="20" y2="-4" stroke="#fde68a" stroke-width="2" opacity="0.7"/>
      <line x1="-20" y1="14" x2="20" y2="14" stroke="#fde68a" stroke-width="2" opacity="0.7"/>
      <line x1="-20" y1="32" x2="20" y2="32" stroke="#fde68a" stroke-width="2" opacity="0.7"/>
    </g>
    <g id="rivet">
      <circle r="4" fill="url(#brass)"/>
    </g>
    <g id="bench">
      <rect x="-34" y="-12" width="68" height="24" rx="8" fill="#b45309" stroke="#fde68a" stroke-width="1.5"/>
      <rect x="-34" y="-12" width="68" height="8" rx="6" fill="#fde68a" opacity="0.35"/>
    </g>
  </defs>

  <rect width="1800" height="800" fill="#0f172a"/>

  <!-- decorative brass frame -->
  <rect x="16" y="16" width="1768" height="768" rx="20" fill="none" stroke="url(#brass)" stroke-width="5"/>
  <rect x="28" y="28" width="1744" height="744" rx="14" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  <use href="#rivet" x="40" y="40"/>
  <use href="#rivet" x="1760" y="40"/>
  <use href="#rivet" x="40" y="760"/>
  <use href="#rivet" x="1760" y="760"/>

  <text x="60" y="72" fill="#fde68a" font-size="72" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Midnight Express &#8212; Sleeper Section</text>
  <text x="62" y="98" fill="#94a3b8" font-size="32" font-family="Georgia, 'Times New Roman', serif">Cabin Row  &#183;  Observation Corridor</text>

  <!-- compass / direction of travel -->
  <g transform="translate(1668,78)">
    <circle r="34" fill="#0b1120" stroke="url(#brass)" stroke-width="3"/>
    <path d="M0,-24 L8,4 L0,-6 L-8,4 Z" fill="#fde68a"/>
    <text x="0" y="-30" fill="#fde68a" font-size="23" font-family="Georgia, serif" text-anchor="middle">N</text>
  </g>

  <!-- ================= CAR 1 : CABIN ROW ================= -->
  <g>
    <rect x="80" y="168" width="770" height="492" rx="46" fill="url(#cabinHull)" stroke="url(#brass)" stroke-width="6"/>
    <rect x="98" y="186" width="734" height="456" rx="34" fill="#2a0a0a" opacity="0.25"/>

    <!-- hull rivets -->
    <use href="#rivet" x="110" y="178"/><use href="#rivet" x="200" y="178"/><use href="#rivet" x="290" y="178"/>
    <use href="#rivet" x="380" y="178"/><use href="#rivet" x="470" y="178"/><use href="#rivet" x="560" y="178"/>
    <use href="#rivet" x="650" y="178"/><use href="#rivet" x="740" y="178"/><use href="#rivet" x="820" y="178"/>
    <use href="#rivet" x="110" y="650"/><use href="#rivet" x="200" y="650"/><use href="#rivet" x="290" y="650"/>
    <use href="#rivet" x="380" y="650"/><use href="#rivet" x="470" y="650"/><use href="#rivet" x="560" y="650"/>
    <use href="#rivet" x="650" y="650"/><use href="#rivet" x="740" y="650"/><use href="#rivet" x="820" y="650"/>

    <!-- windows along both sides -->
    <g>
      <rect x="130" y="196" width="60" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
      <rect x="222" y="196" width="60" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
      <rect x="314" y="196" width="60" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
      <rect x="480" y="196" width="60" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
      <rect x="572" y="196" width="60" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
      <rect x="664" y="196" width="60" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
      <rect x="756" y="196" width="60" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
    </g>

    <!-- title label for car -->
    <text x="465" y="238" text-anchor="middle" fill="#fde68a" font-size="57" font-family="Georgia, 'Times New Roman', serif">Cabin Row</text>
    <text x="465" y="262" text-anchor="middle" fill="#fecaca" font-size="28" font-family="Georgia, 'Times New Roman', serif">row of private sleeper cabins</text>

    <!-- four cabin compartments -->
    <g>
      <rect x="115" y="288" width="167" height="290" fill="url(#cabinRoom)" stroke="url(#brass)" stroke-width="2.5"/>
      <rect x="290" y="288" width="167" height="290" fill="url(#cabinRoom)" stroke="url(#brass)" stroke-width="2.5"/>
      <rect x="465" y="288" width="167" height="290" fill="url(#cabinRoom)" stroke="url(#brass)" stroke-width="2.5"/>
      <rect x="640" y="288" width="185" height="290" fill="url(#cabinRoom)" stroke="url(#brass)" stroke-width="2.5"/>
    </g>
    <use href="#bunk" x="198" y="360" transform="rotate(90 198 360)"/>
    <use href="#bunk" x="373" y="360" transform="rotate(90 373 360)"/>
    <use href="#bunk" x="548" y="360" transform="rotate(90 548 360)"/>
    <use href="#bunk" x="732" y="360" transform="rotate(90 732 360)"/>
    <use href="#bunk" x="198" y="500" transform="rotate(90 198 500)"/>
    <use href="#bunk" x="373" y="500" transform="rotate(90 373 500)"/>
    <use href="#bunk" x="548" y="500" transform="rotate(90 548 500)"/>
    <use href="#bunk" x="732" y="500" transform="rotate(90 732 500)"/>

    <!-- corridor spine along the bottom -->
    <rect x="115" y="588" width="710" height="46" fill="#1f2937" opacity="0.7" stroke="#334155"/>
    <text x="470" y="616" text-anchor="middle" fill="#94a3b8" font-size="25" font-family="Georgia, serif">corridor</text>

    <!-- platform door hint (cross-floor to Car End Platform) -->
    <g transform="translate(150,690)">
      <rect x="-14" y="-30" width="28" height="30" fill="#1f2937" stroke="url(#brass)" stroke-width="2"/>
      <text x="24" y="-8" fill="#fbbf24" font-size="28" font-family="Georgia, serif">platform door &#8594; wind-heavy route</text>
    </g>
  </g>

  <!-- ================= COUPLING : SLIDING DOORS ================= -->
  <g>
    <path d="M850,220 L866,232 L850,244 L866,256 L850,268" stroke="#334155" stroke-width="4" fill="none"/>
    <path d="M850,600 L866,588 L850,576 L866,564 L850,552" stroke="#334155" stroke-width="4" fill="none"/>
    <rect x="852" y="300" width="76" height="228" fill="#0b1120" stroke="url(#brass)" stroke-width="3"/>
    <rect x="858" y="306" width="30" height="216" fill="#334155" stroke="#94a3b8"/>
    <rect x="892" y="306" width="30" height="216" fill="#334155" stroke="#94a3b8"/>
    <text x="890" y="140" text-anchor="middle" fill="#e2e8f0" font-size="22" font-family="Georgia, serif">sliding doors</text>
  </g>

  <!-- ================= CAR 2 : OBSERVATION CORRIDOR ================= -->
  <g>
    <rect x="930" y="168" width="790" height="492" rx="46" fill="url(#obsHull)" stroke="url(#brass)" stroke-width="6"/>
    <rect x="948" y="186" width="754" height="456" rx="34" fill="url(#obsFloor)"/>

    <use href="#rivet" x="960" y="178"/><use href="#rivet" x="1060" y="178"/><use href="#rivet" x="1160" y="178"/>
    <use href="#rivet" x="1260" y="178"/><use href="#rivet" x="1360" y="178"/><use href="#rivet" x="1460" y="178"/>
    <use href="#rivet" x="1560" y="178"/><use href="#rivet" x="1660" y="178"/>
    <use href="#rivet" x="960" y="650"/><use href="#rivet" x="1060" y="650"/><use href="#rivet" x="1160" y="650"/>
    <use href="#rivet" x="1260" y="650"/><use href="#rivet" x="1360" y="650"/><use href="#rivet" x="1460" y="650"/>
    <use href="#rivet" x="1560" y="650"/><use href="#rivet" x="1660" y="650"/>

    <!-- long glass panels, top and bottom, with brass mullions -->
    <rect x="960" y="196" width="700" height="60" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
    <rect x="960" y="576" width="700" height="60" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
    <g stroke="url(#brass)" stroke-width="3">
      <line x1="1030" y1="196" x2="1030" y2="256"/><line x1="1100" y1="196" x2="1100" y2="256"/>
      <line x1="1170" y1="196" x2="1170" y2="256"/><line x1="1240" y1="196" x2="1240" y2="256"/>
      <line x1="1310" y1="196" x2="1310" y2="256"/><line x1="1380" y1="196" x2="1380" y2="256"/>
      <line x1="1450" y1="196" x2="1450" y2="256"/><line x1="1520" y1="196" x2="1520" y2="256"/>
      <line x1="1590" y1="196" x2="1590" y2="256"/>
      <line x1="1030" y1="576" x2="1030" y2="636"/><line x1="1100" y1="576" x2="1100" y2="636"/>
      <line x1="1170" y1="576" x2="1170" y2="636"/><line x1="1240" y1="576" x2="1240" y2="636"/>
      <line x1="1310" y1="576" x2="1310" y2="636"/><line x1="1380" y1="576" x2="1380" y2="636"/>
      <line x1="1450" y1="576" x2="1450" y2="636"/><line x1="1520" y1="576" x2="1520" y2="636"/>
      <line x1="1590" y1="576" x2="1590" y2="636"/>
    </g>

    <text x="1325" y="248" text-anchor="middle" fill="#fde68a" font-size="30" font-family="Georgia, serif" opacity="0.001">.</text>

    <text x="1325" y="342" text-anchor="middle" fill="#e0f2fe" font-size="57" font-family="Georgia, 'Times New Roman', serif">Observation Corridor</text>
    <text x="1325" y="368" text-anchor="middle" fill="#bae6fd" font-size="28" font-family="Georgia, 'Times New Roman', serif">glass-sided viewing corridor &#8212; excellent sightlines</text>

    <!-- center bench seating row -->
    <use href="#bench" x="1020" y="420"/>
    <use href="#bench" x="1120" y="420"/>
    <use href="#bench" x="1220" y="420"/>
    <use href="#bench" x="1420" y="420"/>
    <use href="#bench" x="1520" y="420"/>
    <use href="#bench" x="1620" y="420"/>

    <!-- car link hint (cross-floor to Dining Car) -->
    <g transform="translate(1720,690)">
      <text x="0" y="0" text-anchor="end" fill="#fbbf24" font-size="28" font-family="Georgia, serif">car link &#8594; Dining Car</text>
    </g>
  </g>

  <!-- rail line + direction of travel -->
  <g>
    <line x1="60" y1="770" x2="1740" y2="770" stroke="#475569" stroke-width="4"/>
    <g stroke="#334155" stroke-width="4">
      <line x1="90" y1="762" x2="90" y2="778"/><line x1="150" y1="762" x2="150" y2="778"/>
      <line x1="210" y1="762" x2="210" y2="778"/><line x1="270" y1="762" x2="270" y2="778"/>
      <line x1="330" y1="762" x2="330" y2="778"/><line x1="390" y1="762" x2="390" y2="778"/>
      <line x1="450" y1="762" x2="450" y2="778"/><line x1="510" y1="762" x2="510" y2="778"/>
      <line x1="570" y1="762" x2="570" y2="778"/><line x1="630" y1="762" x2="630" y2="778"/>
      <line x1="690" y1="762" x2="690" y2="778"/><line x1="750" y1="762" x2="750" y2="778"/>
      <line x1="810" y1="762" x2="810" y2="778"/><line x1="870" y1="762" x2="870" y2="778"/>
      <line x1="930" y1="762" x2="930" y2="778"/><line x1="990" y1="762" x2="990" y2="778"/>
      <line x1="1050" y1="762" x2="1050" y2="778"/><line x1="1110" y1="762" x2="1110" y2="778"/>
      <line x1="1170" y1="762" x2="1170" y2="778"/><line x1="1230" y1="762" x2="1230" y2="778"/>
      <line x1="1290" y1="762" x2="1290" y2="778"/><line x1="1350" y1="762" x2="1350" y2="778"/>
      <line x1="1410" y1="762" x2="1410" y2="778"/><line x1="1470" y1="762" x2="1470" y2="778"/>
      <line x1="1530" y1="762" x2="1530" y2="778"/><line x1="1590" y1="762" x2="1590" y2="778"/>
      <line x1="1650" y1="762" x2="1650" y2="778"/><line x1="1710" y1="762" x2="1710" y2="778"/>
    </g>
    <path d="M1660,770 L1700,770 L1688,758 M1700,770 L1688,782" stroke="#fde68a" stroke-width="4" fill="none"/>
    <text x="1560" y="756" fill="#64748b" font-size="25" font-family="Georgia, serif">direction of travel</text>
  </g>

  <rect width="1800" height="800" fill="url(#vignette)"/>
</svg>
