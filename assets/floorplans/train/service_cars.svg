<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 800">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glassPane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0c4a6e" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.6" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="diningHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="loungeHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="serviceHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="baggageHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44403c"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <g id="rivet">
      <circle r="4" fill="url(#brass)"/>
    </g>
    <g id="diningTable">
      <ellipse rx="46" ry="26" fill="#78350f" stroke="#fde68a" stroke-width="1.5"/>
      <ellipse rx="36" ry="18" fill="#92400e" opacity="0.6"/>
      <circle cx="0" cy="-42" r="10" fill="#b45309" stroke="#fde68a" stroke-width="1"/>
      <circle cx="0" cy="42" r="10" fill="#b45309" stroke="#fde68a" stroke-width="1"/>
      <circle cx="-58" cy="0" r="10" fill="#b45309" stroke="#fde68a" stroke-width="1"/>
      <circle cx="58" cy="0" r="10" fill="#b45309" stroke="#fde68a" stroke-width="1"/>
    </g>
    <g id="armchair">
      <rect x="-22" y="-22" width="44" height="44" rx="14" fill="#5b21b6" stroke="#c4b5fd" stroke-width="1.5"/>
      <rect x="-22" y="-22" width="44" height="14" rx="8" fill="#a78bfa" opacity="0.45"/>
    </g>
    <g id="barCounter">
      <rect x="-60" y="-14" width="120" height="28" rx="6" fill="#3f2d12" stroke="#fde68a" stroke-width="1.5"/>
      <rect x="-60" y="-14" width="120" height="8" fill="#fde68a" opacity="0.3"/>
      <circle cx="-40" cy="0" r="4" fill="#fca5a5"/>
      <circle cx="-16" cy="0" r="4" fill="#86efac"/>
      <circle cx="16" cy="0" r="4" fill="#fde68a"/>
      <circle cx="40" cy="0" r="4" fill="#93c5fd"/>
    </g>
    <g id="crate">
      <rect x="-28" y="-28" width="56" height="56" fill="#57534e" stroke="#a8a29e" stroke-width="2"/>
      <line x1="-28" y1="-28" x2="28" y2="28" stroke="#a8a29e" stroke-width="1" opacity="0.5"/>
      <line x1="28" y1="-28" x2="-28" y2="28" stroke="#a8a29e" stroke-width="1" opacity="0.5"/>
      <rect x="-28" y="-28" width="56" height="12" fill="#78716c" opacity="0.6"/>
    </g>
    <g id="pipe">
      <rect x="-6" y="-42" width="12" height="84" rx="6" fill="#475569" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="0" cy="-28" r="2.5" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="2.5" fill="#cbd5e1"/>
      <circle cx="0" cy="28" r="2.5" fill="#cbd5e1"/>
    </g>
    <g id="valveWheel">
      <circle r="14" fill="none" stroke="#fde68a" stroke-width="3"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#fde68a" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#fde68a" stroke-width="2"/>
      <circle r="3" fill="#fde68a"/>
    </g>
  </defs>

  <rect width="1800" height="800" fill="#0f172a"/>

  <!-- decorative brass frame -->
  <rect x="16" y="16" width="1768" height="768" rx="20" fill="none" stroke="url(#brass)" stroke-width="5"/>
  <rect x="28" y="28" width="1744" height="744" rx="14" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  <use href="#rivet" x="40" y="40"/>
  <use href="#rivet" x="1760" y="40"/>
  <use href="#rivet" x="40" y="760"/>
  <use href="#rivet" x="1760" y="760"/>

  <text x="60" y="72" fill="#fde68a" font-size="72" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Midnight Express &#8212; Service Cars</text>
  <text x="62" y="98" fill="#94a3b8" font-size="32" font-family="Georgia, 'Times New Roman', serif">Dining Car &#183; Smoking Lounge &#183; Service Car &#183; Baggage Hold</text>

  <!-- compass / direction of travel -->
  <g transform="translate(1668,78)">
    <circle r="34" fill="#0b1120" stroke="url(#brass)" stroke-width="3"/>
    <path d="M0,-24 L8,4 L0,-6 L-8,4 Z" fill="#fde68a"/>
    <text x="0" y="-30" fill="#fde68a" font-size="23" font-family="Georgia, serif" text-anchor="middle">N</text>
  </g>

  <!-- ================= CAR 1 : DINING CAR ================= -->
  <g>
    <rect x="80" y="168" width="430" height="492" rx="40" fill="url(#diningHull)" stroke="url(#brass)" stroke-width="6"/>
    <rect x="98" y="186" width="394" height="456" rx="28" fill="#2a1206" opacity="0.28"/>

    <use href="#rivet" x="100" y="178"/><use href="#rivet" x="190" y="178"/><use href="#rivet" x="280" y="178"/>
    <use href="#rivet" x="370" y="178"/><use href="#rivet" x="460" y="178"/>
    <use href="#rivet" x="100" y="650"/><use href="#rivet" x="190" y="650"/><use href="#rivet" x="280" y="650"/>
    <use href="#rivet" x="370" y="650"/><use href="#rivet" x="460" y="650"/>

    <!-- window row -->
    <rect x="110" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
    <rect x="190" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
    <rect x="270" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
    <rect x="350" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
    <rect x="430" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>

    <text x="295" y="238" text-anchor="middle" fill="#fde68a" font-size="57" font-family="Georgia, 'Times New Roman', serif">Dining Car</text>
    <text x="295" y="262" text-anchor="middle" fill="#fed7aa" font-size="28" font-family="Georgia, 'Times New Roman', serif">rows of dining tables &#8212; high social traffic</text>

    <!-- dining tables -->
    <use href="#diningTable" x="165" y="420"/>
    <use href="#diningTable" x="295" y="420"/>
    <use href="#diningTable" x="425" y="420"/>

    <!-- cross-floor hint: back toward Sleeper Section -->
    <g transform="translate(90,700)">
      <rect x="-14" y="-30" width="28" height="30" fill="#1f2937" stroke="url(#brass)" stroke-width="2"/>
      <text x="24" y="-8" fill="#fbbf24" font-size="27" font-family="Georgia, serif">&#8592; car link (Observation Corridor, Sleeper Section)</text>
    </g>
  </g>

  <!-- ============= OPEN CONNECTION : DINING &lt;-&gt; LOUNGE ============= -->
  <g>
    <rect x="510" y="168" width="35" height="40" fill="url(#brass)" opacity="0.55"/>
    <rect x="510" y="620" width="35" height="40" fill="url(#brass)" opacity="0.55"/>
    <line x1="527" y1="212" x2="527" y2="616" stroke="#fde68a" stroke-width="2" stroke-dasharray="7 7" opacity="0.6"/>
    <text x="527" y="460" text-anchor="middle" fill="#fde68a" font-size="16" font-family="Georgia, serif" transform="rotate(-90 527 460)">open car &#8212; widest connection</text>
  </g>

  <!-- ================= CAR 2 : SMOKING LOUNGE ================= -->
  <g>
    <rect x="545" y="168" width="380" height="492" rx="40" fill="url(#loungeHull)" stroke="url(#brass)" stroke-width="6"/>
    <rect x="563" y="186" width="344" height="456" rx="28" fill="#150f2e" opacity="0.32"/>

    <use href="#rivet" x="565" y="178"/><use href="#rivet" x="650" y="178"/><use href="#rivet" x="735" y="178"/>
    <use href="#rivet" x="820" y="178"/><use href="#rivet" x="905" y="178"/>
    <use href="#rivet" x="565" y="650"/><use href="#rivet" x="650" y="650"/><use href="#rivet" x="735" y="650"/>
    <use href="#rivet" x="820" y="650"/><use href="#rivet" x="905" y="650"/>

    <!-- smoky window row -->
    <rect x="565" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2" opacity="0.65"/>
    <rect x="645" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2" opacity="0.65"/>
    <rect x="725" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2" opacity="0.65"/>
    <rect x="805" y="196" width="50" height="34" rx="6" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2" opacity="0.65"/>

    <text x="735" y="238" text-anchor="middle" fill="#e9d5ff" font-size="57" font-family="Georgia, 'Times New Roman', serif">Smoking Lounge</text>
    <text x="735" y="262" text-anchor="middle" fill="#c4b5fd" font-size="28" font-family="Georgia, 'Times New Roman', serif">armchairs &amp; a small bar &#8212; noisy, social</text>

    <!-- armchair cluster -->
    <use href="#armchair" x="610" y="330"/>
    <use href="#armchair" x="695" y="300"/>
    <use href="#armchair" x="780" y="330"/>
    <use href="#armchair" x="610" y="430"/>
    <use href="#armchair" x="780" y="430"/>

    <!-- small bar -->
    <use href="#barCounter" x="695" y="580"/>
  </g>

  <!-- ============= COUPLING : SLIDING DOORS (LOUNGE &lt;-&gt; SERVICE) ============= -->
  <g>
    <path d="M925,220 L941,232 L925,244 L941,256 L925,268" stroke="#334155" stroke-width="4" fill="none"/>
    <path d="M925,600 L941,588 L925,576 L941,564 L925,552" stroke="#334155" stroke-width="4" fill="none"/>
    <rect x="927" y="300" width="76" height="228" fill="#0b1120" stroke="url(#brass)" stroke-width="3"/>
    <rect x="933" y="306" width="30" height="216" fill="#334155" stroke="#94a3b8"/>
    <rect x="967" y="306" width="30" height="216" fill="#334155" stroke="#94a3b8"/>
    <text x="965" y="140" text-anchor="middle" fill="#e2e8f0" font-size="22" font-family="Georgia, serif">sliding doors</text>
  </g>

  <!-- ================= CAR 3 : SERVICE CAR ================= -->
  <g>
    <rect x="1005" y="168" width="220" height="492" rx="30" fill="url(#serviceHull)" stroke="url(#brass)" stroke-width="6"/>
    <rect x="1023" y="186" width="184" height="456" rx="20" fill="#0a1120" opacity="0.35"/>

    <use href="#rivet" x="1025" y="178"/><use href="#rivet" x="1115" y="178"/><use href="#rivet" x="1205" y="178"/>
    <use href="#rivet" x="1025" y="650"/><use href="#rivet" x="1115" y="650"/><use href="#rivet" x="1205" y="650"/>

    <!-- two small portholes, no proper windows: pure utility car -->
    <circle cx="1065" cy="214" r="15" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>
    <circle cx="1165" cy="214" r="15" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2"/>

    <text x="1115" y="252" text-anchor="middle" fill="#e2e8f0" font-size="30" font-family="Georgia, 'Times New Roman', serif">Service Car</text>
    <text x="1115" y="272" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Georgia, 'Times New Roman', serif">narrow utility chokepoint</text>

    <!-- pipes running along both walls -->
    <use href="#pipe" x="1035" y="360"/>
    <use href="#pipe" x="1035" y="480"/>
    <use href="#pipe" x="1195" y="360"/>
    <use href="#pipe" x="1195" y="480"/>

    <!-- central walkway -->
    <rect x="1065" y="330" width="100" height="230" fill="#1e293b" opacity="0.6" stroke="#334155"/>
    <use href="#valveWheel" x="1115" y="420"/>

    <!-- cross-floor hint: down to Exterior Route -->
    <g transform="translate(1005,700)">
      <text x="0" y="0" fill="#fbbf24" font-size="27" font-family="Georgia, serif">&#9881; maintenance access &#8594; Engine Walkway (Exterior Route)</text>
    </g>
  </g>

  <!-- ============= NARROW PASSAGE : SERVICE &lt;-&gt; BAGGAGE ============= -->
  <g>
    <rect x="1225" y="168" width="25" height="182" fill="#0b1120" opacity="0.9"/>
    <rect x="1225" y="470" width="25" height="190" fill="#0b1120" opacity="0.9"/>
    <rect x="1226" y="350" width="23" height="120" fill="#0b1120" stroke="url(#brass)" stroke-width="3"/>
    <line x1="1237" y1="360" x2="1237" y2="460" stroke="#fde68a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="1237" y="338" text-anchor="middle" fill="#fbbf24" font-size="23" font-family="Georgia, serif">narrow passage</text>
  </g>

  <!-- ================= CAR 4 : BAGGAGE HOLD ================= -->
  <g>
    <rect x="1250" y="168" width="470" height="492" rx="34" fill="url(#baggageHull)" stroke="url(#brass)" stroke-width="6"/>
    <rect x="1268" y="186" width="434" height="456" rx="24" fill="#0b0a09" opacity="0.35"/>

    <use href="#rivet" x="1270" y="178"/><use href="#rivet" x="1360" y="178"/><use href="#rivet" x="1450" y="178"/>
    <use href="#rivet" x="1540" y="178"/><use href="#rivet" x="1630" y="178"/><use href="#rivet" x="1700" y="178"/>
    <use href="#rivet" x="1270" y="650"/><use href="#rivet" x="1360" y="650"/><use href="#rivet" x="1450" y="650"/>
    <use href="#rivet" x="1540" y="650"/><use href="#rivet" x="1630" y="650"/><use href="#rivet" x="1700" y="650"/>

    <!-- two small, grimy windows -->
    <rect x="1290" y="196" width="50" height="30" rx="5" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2" opacity="0.45"/>
    <rect x="1640" y="196" width="50" height="30" rx="5" fill="url(#glassPane)" stroke="url(#brass)" stroke-width="2" opacity="0.45"/>

    <text x="1485" y="240" text-anchor="middle" fill="#e7e5e4" font-size="57" font-family="Georgia, 'Times New Roman', serif">Baggage Hold</text>
    <text x="1485" y="264" text-anchor="middle" fill="#a8a29e" font-size="28" font-family="Georgia, 'Times New Roman', serif">stacked crates &#8212; cramped, limited exits</text>

    <!-- crate stacks (translate to position, THEN scale, so scaling doesn't
         also shrink the x/y placement — a bare x/y+scale(s) on <use> scales
         the placement too, landing these crates in the wrong car) -->
    <use href="#crate" x="1330" y="380"/>
    <g transform="translate(1330,450) scale(0.8)"><use href="#crate"/></g>
    <use href="#crate" x="1470" y="410"/>
    <g transform="translate(1470,480) scale(0.75)"><use href="#crate"/></g>
    <use href="#crate" x="1610" y="390"/>
    <g transform="translate(1610,460) scale(0.8)"><use href="#crate"/></g>
    <g transform="translate(1610,520) scale(0.6)"><use href="#crate"/></g>
  </g>

  <!-- rail line + direction of travel -->
  <g>
    <line x1="60" y1="770" x2="1740" y2="770" stroke="#475569" stroke-width="4"/>
    <g stroke="#334155" stroke-width="4">
      <line x1="90" y1="762" x2="90" y2="778"/><line x1="150" y1="762" x2="150" y2="778"/>
      <line x1="210" y1="762" x2="210" y2="778"/><line x1="270" y1="762" x2="270" y2="778"/>
      <line x1="330" y1="762" x2="330" y2="778"/><line x1="390" y1="762" x2="390" y2="778"/>
      <line x1="450" y1="762" x2="450" y2="778"/><line x1="510" y1="762" x2="510" y2="778"/>
      <line x1="570" y1="762" x2="570" y2="778"/><line x1="630" y1="762" x2="630" y2="778"/>
      <line x1="690" y1="762" x2="690" y2="778"/><line x1="750" y1="762" x2="750" y2="778"/>
      <line x1="810" y1="762" x2="810" y2="778"/><line x1="870" y1="762" x2="870" y2="778"/>
      <line x1="930" y1="762" x2="930" y2="778"/><line x1="990" y1="762" x2="990" y2="778"/>
      <line x1="1050" y1="762" x2="1050" y2="778"/><line x1="1110" y1="762" x2="1110" y2="778"/>
      <line x1="1170" y1="762" x2="1170" y2="778"/><line x1="1230" y1="762" x2="1230" y2="778"/>
      <line x1="1290" y1="762" x2="1290" y2="778"/><line x1="1350" y1="762" x2="1350" y2="778"/>
      <line x1="1410" y1="762" x2="1410" y2="778"/><line x1="1470" y1="762" x2="1470" y2="778"/>
      <line x1="1530" y1="762" x2="1530" y2="778"/><line x1="1590" y1="762" x2="1590" y2="778"/>
      <line x1="1650" y1="762" x2="1650" y2="778"/><line x1="1710" y1="762" x2="1710" y2="778"/>
    </g>
    <path d="M1660,770 L1700,770 L1688,758 M1700,770 L1688,782" stroke="#fde68a" stroke-width="4" fill="none"/>
    <text x="1560" y="756" fill="#64748b" font-size="25" font-family="Georgia, serif">direction of travel</text>
  </g>

  <rect width="1800" height="800" fill="url(#vignette)"/>
</svg>
