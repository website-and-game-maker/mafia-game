<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 800">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#b45309"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glassPane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0c4a6e" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.6" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="platformHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1224"/>
    </linearGradient>
    <linearGradient id="engineHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#1c0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <g id="rivet">
      <circle r="4" fill="url(#brass)"/>
    </g>
    <g id="grateTile">
      <rect x="-30" y="-10" width="60" height="20" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="-30" y1="-10" x2="30" y2="10" stroke="#64748b" stroke-width="1"/>
      <line x1="-16" y1="-10" x2="44" y2="10" stroke="#64748b" stroke-width="1" opacity="0.6"/>
      <line x1="-44" y1="-10" x2="16" y2="10" stroke="#64748b" stroke-width="1" opacity="0.6"/>
    </g>
    <g id="steamPipe">
      <rect x="-7" y="-46" width="14" height="92" rx="7" fill="#57534e" stroke="#a8a29e" stroke-width="1.3"/>
      <circle cx="0" cy="-30" r="3" fill="#fde68a"/>
      <circle cx="0" cy="0" r="3" fill="#fde68a"/>
      <circle cx="0" cy="30" r="3" fill="#fde68a"/>
    </g>
    <g id="valveWheel">
      <circle r="14" fill="none" stroke="#fde68a" stroke-width="3"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#fde68a" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#fde68a" stroke-width="2"/>
      <circle r="3" fill="#fde68a"/>
    </g>
    <g id="steamCloud">
      <ellipse rx="26" ry="14" fill="#e2e8f0" opacity="0.25"/>
      <ellipse rx="16" ry="9" cx="16" cy="-8" fill="#e2e8f0" opacity="0.28"/>
    </g>
  </defs>

  <rect width="1800" height="800" fill="#0f172a"/>

  <!-- faint night-sky stars, exterior feel -->
  <g fill="#e2e8f0">
    <circle cx="150" cy="130" r="1.6" opacity="0.5"/>
    <circle cx="330" cy="105" r="1.2" opacity="0.4"/>
    <circle cx="620" cy="140" r="1.4" opacity="0.5"/>
    <circle cx="900" cy="118" r="1.8" opacity="0.55"/>
    <circle cx="900" cy="440" r="1.3" opacity="0.45"/>
    <circle cx="905" cy="560" r="1.5" opacity="0.4"/>
    <circle cx="1140" cy="128" r="1.3" opacity="0.4"/>
    <circle cx="1450" cy="108" r="1.6" opacity="0.5"/>
    <circle cx="1620" cy="140" r="1.2" opacity="0.4"/>
  </g>

  <!-- decorative brass frame -->
  <rect x="16" y="16" width="1768" height="768" rx="20" fill="none" stroke="url(#brass)" stroke-width="5"/>
  <rect x="28" y="28" width="1744" height="744" rx="14" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  <use href="#rivet" x="40" y="40"/>
  <use href="#rivet" x="1760" y="40"/>
  <use href="#rivet" x="40" y="760"/>
  <use href="#rivet" x="1760" y="760"/>

  <text x="60" y="72" fill="#fde68a" font-size="38" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Midnight Express &#8212; Exterior Route</text>
  <text x="62" y="98" fill="#94a3b8" font-size="17" font-family="Georgia, 'Times New Roman', serif">Car End Platform &#183; Engine Walkway &#8212; two separate open-air zones, no route between them</text>

  <!-- compass / direction of travel -->
  <g transform="translate(1668,78)">
    <circle r="34" fill="#0b1120" stroke="url(#brass)" stroke-width="3"/>
    <path d="M0,-24 L8,4 L0,-6 L-8,4 Z" fill="#fde68a"/>
    <text x="0" y="-30" fill="#fde68a" font-size="12" font-family="Georgia, serif" text-anchor="middle">N</text>
  </g>

  <!-- ================= ZONE 1 : CAR END PLATFORM ================= -->
  <g>
    <rect x="80" y="168" width="740" height="492" rx="40" fill="url(#platformHull)" stroke="url(#brass)" stroke-width="6"/>
    <rect x="98" y="186" width="704" height="456" rx="28" fill="#050912" opacity="0.5"/>

    <use href="#rivet" x="100" y="178"/><use href="#rivet" x="190" y="178"/><use href="#rivet" x="280" y="178"/>
    <use href="#rivet" x="370" y="178"/><use href="#rivet" x="460" y="178"/><use href="#rivet" x="550" y="178"/>
    <use href="#rivet" x="640" y="178"/><use href="#rivet" x="730" y="178"/><use href="#rivet" x="800" y="178"/>
    <use href="#rivet" x="100" y="650"/><use href="#rivet" x="190" y="650"/><use href="#rivet" x="280" y="650"/>
    <use href="#rivet" x="370" y="650"/><use href="#rivet" x="460" y="650"/><use href="#rivet" x="550" y="650"/>
    <use href="#rivet" x="640" y="650"/><use href="#rivet" x="730" y="650"/><use href="#rivet" x="800" y="650"/>

    <!-- bellows / concertina couplings at each far end, suggesting adjoining cars just out of frame -->
    <path d="M112,210 L128,240 L112,270 L128,300 L112,330 L128,360 L112,390 L128,420 L112,450 L128,480 L112,510 L128,540 L112,570 L128,600 L112,618" fill="none" stroke="#475569" stroke-width="3"/>
    <path d="M788,210 L772,240 L788,270 L772,300 L788,330 L772,360 L788,390 L772,420 L788,450 L772,480 L788,510 L772,540 L788,570 L772,600 L788,618" fill="none" stroke="#475569" stroke-width="3"/>

    <!-- open railing along the outward-facing long edges -->
    <line x1="150" y1="196" x2="750" y2="196" stroke="#94a3b8" stroke-width="3"/>
    <line x1="150" y1="222" x2="750" y2="222" stroke="#64748b" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="170" y1="196" x2="170" y2="228"/><line x1="230" y1="196" x2="230" y2="228"/>
      <line x1="290" y1="196" x2="290" y2="228"/><line x1="350" y1="196" x2="350" y2="228"/>
      <line x1="410" y1="196" x2="410" y2="228"/><line x1="470" y1="196" x2="470" y2="228"/>
      <line x1="530" y1="196" x2="530" y2="228"/><line x1="590" y1="196" x2="590" y2="228"/>
      <line x1="650" y1="196" x2="650" y2="228"/><line x1="710" y1="196" x2="710" y2="228"/>
    </g>
    <line x1="150" y1="632" x2="750" y2="632" stroke="#94a3b8" stroke-width="3"/>
    <line x1="150" y1="606" x2="750" y2="606" stroke="#64748b" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="170" y1="600" x2="170" y2="632"/><line x1="230" y1="600" x2="230" y2="632"/>
      <line x1="290" y1="600" x2="290" y2="632"/><line x1="350" y1="600" x2="350" y2="632"/>
      <line x1="410" y1="600" x2="410" y2="632"/><line x1="470" y1="600" x2="470" y2="632"/>
      <line x1="530" y1="600" x2="530" y2="632"/><line x1="590" y1="600" x2="590" y2="632"/>
      <line x1="650" y1="600" x2="650" y2="632"/><line x1="710" y1="600" x2="710" y2="632"/>
    </g>

    <!-- open grated floor -->
    <use href="#grateTile" x="270" y="420"/>
    <use href="#grateTile" x="340" y="420"/>
    <use href="#grateTile" x="460" y="420"/>
    <use href="#grateTile" x="530" y="420"/>
    <use href="#grateTile" x="600" y="420"/>

    <!-- wind swirls -->
    <path d="M240,300 Q290,280 330,300 Q370,320 410,300" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M500,330 Q550,310 590,330 Q630,350 670,330" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.45"/>
    <path d="M300,520 Q350,500 390,520 Q430,540 470,520" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.4"/>

    <text x="450" y="256" text-anchor="middle" fill="#e2e8f0" font-size="30" font-family="Georgia, 'Times New Roman', serif">Car End Platform</text>
    <text x="450" y="280" text-anchor="middle" fill="#94a3b8" font-size="15" font-family="Georgia, 'Times New Roman', serif">open-air, between cars &#8212; good sightlines, wind masks footsteps</text>

    <!-- cross-floor hint: back to interior -->
    <g transform="translate(150,700)">
      <rect x="-14" y="-30" width="28" height="30" fill="#1f2937" stroke="url(#brass)" stroke-width="2"/>
      <text x="24" y="-8" fill="#fbbf24" font-size="15" font-family="Georgia, serif">platform door &#8592; Cabin Row</text>
    </g>
  </g>

  <!-- ================= GAP : NO DIRECT ROUTE ================= -->
  <g>
    <circle cx="850" cy="230" r="1.6" fill="#e2e8f0" opacity="0.5"/>
    <circle cx="900" cy="300" r="1.3" fill="#e2e8f0" opacity="0.4"/>
    <circle cx="940" cy="200" r="1.5" fill="#e2e8f0" opacity="0.45"/>
    <circle cx="870" cy="480" r="1.4" fill="#e2e8f0" opacity="0.4"/>
    <circle cx="930" cy="550" r="1.6" fill="#e2e8f0" opacity="0.5"/>
    <text x="900" y="420" text-anchor="middle" fill="#475569" font-size="14" font-family="Georgia, serif" font-style="italic">(no walkway &#8212; separate access only)</text>
  </g>

  <!-- ================= ZONE 2 : ENGINE WALKWAY ================= -->
  <g>
    <rect x="980" y="168" width="740" height="492" rx="40" fill="url(#engineHull)" stroke="url(#brass)" stroke-width="6"/>
    <rect x="998" y="186" width="704" height="456" rx="28" fill="#0e0402" opacity="0.5"/>

    <use href="#rivet" x="1000" y="178"/><use href="#rivet" x="1070" y="178"/><use href="#rivet" x="1140" y="178"/>
    <use href="#rivet" x="1210" y="178"/><use href="#rivet" x="1280" y="178"/><use href="#rivet" x="1350" y="178"/>
    <use href="#rivet" x="1420" y="178"/><use href="#rivet" x="1490" y="178"/><use href="#rivet" x="1560" y="178"/>
    <use href="#rivet" x="1630" y="178"/><use href="#rivet" x="1700" y="178"/>

    <!-- boiler / engine machinery block occupying upper portion -->
    <rect x="998" y="186" width="704" height="270" fill="#450a0a" opacity="0.55" stroke="url(#brass)" stroke-width="2"/>
    <use href="#rivet" x="1030" y="220"/><use href="#rivet" x="1120" y="220"/><use href="#rivet" x="1210" y="220"/>
    <use href="#rivet" x="1300" y="220"/><use href="#rivet" x="1390" y="220"/><use href="#rivet" x="1480" y="220"/>
    <use href="#rivet" x="1570" y="220"/><use href="#rivet" x="1660" y="220"/>
    <use href="#rivet" x="1030" y="420"/><use href="#rivet" x="1120" y="420"/><use href="#rivet" x="1210" y="420"/>
    <use href="#rivet" x="1300" y="420"/><use href="#rivet" x="1390" y="420"/><use href="#rivet" x="1480" y="420"/>
    <use href="#rivet" x="1570" y="420"/><use href="#rivet" x="1660" y="420"/>

    <!-- glowing firebox slit -->
    <rect x="1290" y="300" width="120" height="20" rx="8" fill="url(#glow)"/>
    <rect x="1290" y="300" width="120" height="20" rx="8" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.8"/>

    <text x="1350" y="250" text-anchor="middle" fill="#fed7aa" font-size="16" font-family="Georgia, serif" opacity="0.85">engine machinery</text>

    <!-- steam pipes + valves running along the boiler's lower seam -->
    <use href="#steamPipe" x="1060" y="380"/>
    <use href="#valveWheel" x="1130" y="440"/>
    <use href="#steamPipe" x="1550" y="380"/>
    <use href="#valveWheel" x="1620" y="440"/>
    <use href="#steamCloud" x="1080" y="330"/>
    <use href="#steamCloud" x="1580" y="330"/>

    <!-- narrow catwalk strip along the outer edge -->
    <rect x="998" y="470" width="704" height="90" fill="#1c1917" opacity="0.55" stroke="#334155"/>
    <use href="#grateTile" x="1080" y="515"/>
    <use href="#grateTile" x="1200" y="515"/>
    <use href="#grateTile" x="1500" y="515"/>
    <use href="#grateTile" x="1620" y="515"/>

    <!-- open railing along the very outer (bottom) edge -->
    <line x1="1010" y1="580" x2="1690" y2="580" stroke="#94a3b8" stroke-width="3"/>
    <line x1="1010" y1="602" x2="1690" y2="602" stroke="#64748b" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="1040" y1="580" x2="1040" y2="606"/><line x1="1100" y1="580" x2="1100" y2="606"/>
      <line x1="1160" y1="580" x2="1160" y2="606"/><line x1="1220" y1="580" x2="1220" y2="606"/>
      <line x1="1280" y1="580" x2="1280" y2="606"/><line x1="1340" y1="580" x2="1340" y2="606"/>
      <line x1="1400" y1="580" x2="1400" y2="606"/><line x1="1460" y1="580" x2="1460" y2="606"/>
      <line x1="1520" y1="580" x2="1520" y2="606"/><line x1="1580" y1="580" x2="1580" y2="606"/>
      <line x1="1640" y1="580" x2="1640" y2="606"/>
    </g>

    <text x="1350" y="642" text-anchor="middle" fill="#fed7aa" font-size="27" font-family="Georgia, 'Times New Roman', serif">Engine Walkway</text>
    <text x="1350" y="663" text-anchor="middle" fill="#fdba74" font-size="14" font-family="Georgia, 'Times New Roman', serif">narrow catwalk near the engine &#8212; high risk</text>

    <!-- cross-floor hint: back to interior -->
    <g transform="translate(1650,700)">
      <text x="0" y="0" text-anchor="end" fill="#fbbf24" font-size="15" font-family="Georgia, serif">maintenance access &#8592; Service Car</text>
    </g>
  </g>

  <!-- rail line + direction of travel -->
  <g>
    <line x1="60" y1="770" x2="1740" y2="770" stroke="#475569" stroke-width="4"/>
    <g stroke="#334155" stroke-width="4">
      <line x1="90" y1="762" x2="90" y2="778"/><line x1="150" y1="762" x2="150" y2="778"/>
      <line x1="210" y1="762" x2="210" y2="778"/><line x1="270" y1="762" x2="270" y2="778"/>
      <line x1="330" y1="762" x2="330" y2="778"/><line x1="390" y1="762" x2="390" y2="778"/>
      <line x1="450" y1="762" x2="450" y2="778"/><line x1="510" y1="762" x2="510" y2="778"/>
      <line x1="570" y1="762" x2="570" y2="778"/><line x1="630" y1="762" x2="630" y2="778"/>
      <line x1="690" y1="762" x2="690" y2="778"/><line x1="750" y1="762" x2="750" y2="778"/>
      <line x1="810" y1="762" x2="810" y2="778"/><line x1="870" y1="762" x2="870" y2="778"/>
      <line x1="930" y1="762" x2="930" y2="778"/><line x1="990" y1="762" x2="990" y2="778"/>
      <line x1="1050" y1="762" x2="1050" y2="778"/><line x1="1110" y1="762" x2="1110" y2="778"/>
      <line x1="1170" y1="762" x2="1170" y2="778"/><line x1="1230" y1="762" x2="1230" y2="778"/>
      <line x1="1290" y1="762" x2="1290" y2="778"/><line x1="1350" y1="762" x2="1350" y2="778"/>
      <line x1="1410" y1="762" x2="1410" y2="778"/><line x1="1470" y1="762" x2="1470" y2="778"/>
      <line x1="1530" y1="762" x2="1530" y2="778"/><line x1="1590" y1="762" x2="1590" y2="778"/>
      <line x1="1650" y1="762" x2="1650" y2="778"/><line x1="1710" y1="762" x2="1710" y2="778"/>
    </g>
    <path d="M1660,770 L1700,770 L1688,758 M1700,770 L1688,782" stroke="#fde68a" stroke-width="4" fill="none"/>
    <text x="1560" y="756" fill="#64748b" font-size="13" font-family="Georgia, serif">direction of travel</text>
  </g>

  <rect width="1800" height="800" fill="url(#vignette)"/>
</svg>
