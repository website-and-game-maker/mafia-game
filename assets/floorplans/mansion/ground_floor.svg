<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780">
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e6b0"/>
      <stop offset="0.5" stop-color="#b8860b"/>
      <stop offset="1" stop-color="#5c3d0a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="planks" width="60" height="16" patternUnits="userSpaceOnUse">
      <rect width="60" height="16" fill="#6b4423"/>
      <line x1="0" y1="16" x2="60" y2="16" stroke="#4a2f18" stroke-width="1"/>
      <line x1="18" y1="0" x2="18" y2="16" stroke="#4a2f18" stroke-width="0.6" opacity="0.6"/>
      <line x1="40" y1="0" x2="40" y2="16" stroke="#4a2f18" stroke-width="0.6" opacity="0.6"/>
    </pattern>
    <pattern id="stone" width="50" height="26" patternUnits="userSpaceOnUse">
      <rect width="50" height="26" fill="#2b2b2b"/>
      <rect x="1" y="1" width="22" height="10" fill="#3f3f3f" stroke="#181818" stroke-width="1"/>
      <rect x="26" y="1" width="22" height="10" fill="#383838" stroke="#181818" stroke-width="1"/>
      <rect x="1" y="14" width="10" height="10" fill="#383838" stroke="#181818" stroke-width="1"/>
      <rect x="14" y="14" width="22" height="10" fill="#3f3f3f" stroke="#181818" stroke-width="1"/>
      <rect x="39" y="14" width="10" height="10" fill="#383838" stroke="#181818" stroke-width="1"/>
    </pattern>
    <g id="fireplace">
      <rect x="-32" y="-16" width="64" height="32" fill="#3b2412" stroke="#1f1408" stroke-width="2"/>
      <path d="M-20,16 L20,16 L14,-8 A14,14 0 0 0 -14,-8 Z" fill="#181818" stroke="#0a0a0a" stroke-width="1.5"/>
      <path d="M-8,12 Q0,-6 8,12 Q0,2 -8,12 Z" fill="#f97316" opacity="0.85"/>
      <path d="M-4,10 Q0,-1 4,10 Q0,3 -4,10 Z" fill="#fde68a" opacity="0.9"/>
    </g>
    <g id="sofa">
      <rect x="-44" y="-16" width="88" height="32" rx="8" fill="#78350f" stroke="#2a1608" stroke-width="2"/>
      <rect x="-48" y="-6" width="8" height="20" rx="4" fill="#5c3d0a"/>
      <rect x="40" y="-6" width="8" height="20" rx="4" fill="#5c3d0a"/>
      <line x1="-15" y1="-16" x2="-15" y2="16" stroke="#2a1608" stroke-width="1.5" opacity="0.6"/>
      <line x1="15" y1="-16" x2="15" y2="16" stroke="#2a1608" stroke-width="1.5" opacity="0.6"/>
    </g>
    <g id="armchair">
      <rect x="-20" y="-18" width="40" height="36" rx="9" fill="#78350f" stroke="#2a1608" stroke-width="2"/>
      <rect x="-24" y="-8" width="8" height="22" rx="4" fill="#5c3d0a" stroke="#2a1608" stroke-width="1"/>
      <rect x="16" y="-8" width="8" height="22" rx="4" fill="#5c3d0a" stroke="#2a1608" stroke-width="1"/>
    </g>
    <g id="diningtable">
      <rect x="-72" y="-24" width="144" height="48" rx="10" fill="#5c3d0a" stroke="#2a1608" stroke-width="2.5"/>
      <circle cx="-46" cy="0" r="7" fill="#e2e8f0" opacity="0.8"/>
      <circle cx="0" cy="0" r="7" fill="#e2e8f0" opacity="0.8"/>
      <circle cx="46" cy="0" r="7" fill="#e2e8f0" opacity="0.8"/>
    </g>
    <g id="cabinet">
      <rect x="-55" y="-12" width="110" height="24" fill="#3b2412" stroke="#1f1408" stroke-width="2"/>
      <line x1="-27" y1="-12" x2="-27" y2="12" stroke="#1f1408"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#1f1408"/>
      <line x1="27" y1="-12" x2="27" y2="12" stroke="#1f1408"/>
    </g>
    <g id="winerack">
      <rect x="-42" y="-52" width="84" height="104" fill="#2a1608" stroke="#180c04" stroke-width="2"/>
      <g fill="#5c1a1a" stroke="#1a0d04" stroke-width="1">
        <circle cx="-28" cy="-36" r="6"/><circle cx="-9" cy="-36" r="6"/><circle cx="9" cy="-36" r="6"/><circle cx="28" cy="-36" r="6"/>
        <circle cx="-28" cy="-12" r="6"/><circle cx="-9" cy="-12" r="6"/><circle cx="9" cy="-12" r="6"/><circle cx="28" cy="-12" r="6"/>
        <circle cx="-28" cy="12" r="6"/><circle cx="-9" cy="12" r="6"/><circle cx="9" cy="12" r="6"/><circle cx="28" cy="12" r="6"/>
        <circle cx="-28" cy="36" r="6"/><circle cx="-9" cy="36" r="6"/><circle cx="9" cy="36" r="6"/><circle cx="28" cy="36" r="6"/>
      </g>
    </g>
    <g id="lantern">
      <circle r="16" fill="url(#glow)"/>
      <rect x="-4" y="-6" width="8" height="10" fill="#3b2412" stroke="#1a0d04" stroke-width="1"/>
      <circle r="4" fill="#fde68a"/>
    </g>
    <g id="stairsdown">
      <rect x="-26" y="8" width="52" height="6" fill="#94a3b8"/>
      <rect x="-19" y="0" width="38" height="6" fill="#94a3b8"/>
      <rect x="-12" y="-8" width="24" height="6" fill="#94a3b8"/>
      <rect x="-5" y="-16" width="10" height="6" fill="#94a3b8"/>
      <path d="M0,14 L0,30 M0,30 L-6,22 M0,30 L6,22" stroke="#e2e8f0" stroke-width="2.5" fill="none"/>
    </g>
    <g id="stairsup">
      <rect x="-5" y="-16" width="10" height="6" fill="#94a3b8"/>
      <rect x="-12" y="-8" width="24" height="6" fill="#94a3b8"/>
      <rect x="-19" y="0" width="38" height="6" fill="#94a3b8"/>
      <rect x="-26" y="8" width="52" height="6" fill="#94a3b8"/>
      <path d="M0,-16 L0,-32 M0,-32 L-6,-24 M0,-32 L6,-24" stroke="#e2e8f0" stroke-width="2.5" fill="none"/>
    </g>
    <g id="grandstairs">
      <rect x="-52" y="60" width="104" height="14" fill="#94a3b8"/>
      <rect x="-44" y="44" width="88" height="14" fill="#94a3b8"/>
      <rect x="-36" y="28" width="72" height="14" fill="#94a3b8"/>
      <rect x="-28" y="12" width="56" height="14" fill="#94a3b8"/>
      <rect x="-20" y="-4" width="40" height="14" fill="#94a3b8"/>
      <rect x="-12" y="-20" width="24" height="14" fill="#94a3b8"/>
      <path d="M-54,74 L-54,-20" stroke="#caa257" stroke-width="2" opacity="0.6"/>
      <path d="M54,74 L54,-20" stroke="#caa257" stroke-width="2" opacity="0.6"/>
    </g>
  </defs>

  <rect width="1200" height="780" fill="#0f172a"/>

  <rect x="20" y="20" width="1160" height="740" rx="24" fill="none" stroke="url(#gilt)" stroke-width="6"/>
  <rect x="34" y="34" width="1132" height="712" rx="16" fill="none" stroke="#5c3d0a" stroke-width="1.5" opacity="0.6"/>
  <circle cx="34" cy="34" r="5" fill="url(#gilt)"/><circle cx="1166" cy="34" r="5" fill="url(#gilt)"/>
  <circle cx="34" cy="746" r="5" fill="url(#gilt)"/><circle cx="1166" cy="746" r="5" fill="url(#gilt)"/>

  <text x="600" y="70" text-anchor="middle" fill="#f3e3b3" font-size="34" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Blackwood Estate &#8212; Ground Floor</text>
  <text x="600" y="96" text-anchor="middle" fill="#c9a66b" font-size="16" font-family="Georgia, 'Times New Roman', serif">Main Level &#183; Public &amp; Service Rooms</text>

  <!-- ============= FOYER ============= -->
  <g>
    <rect x="90" y="170" width="260" height="280" fill="url(#planks)"/>
    <rect x="90" y="170" width="260" height="280" fill="#94a3b8" opacity="0.08"/>
    <!-- walls with gaps: archway right (250-370 col range), front door left (280-360), hall gap bottom (170-260) -->
    <line x1="90" y1="170" x2="350" y2="170" stroke="#241205" stroke-width="10"/>
    <line x1="90" y1="170" x2="350" y2="170" stroke="#caa257" stroke-width="2" opacity="0.5"/>
    <line x1="350" y1="170" x2="350" y2="250" stroke="#241205" stroke-width="10"/>
    <line x1="350" y1="370" x2="350" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="90" y1="450" x2="170" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="260" y1="450" x2="350" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="90" y1="170" x2="90" y2="280" stroke="#241205" stroke-width="10"/>
    <line x1="90" y1="360" x2="90" y2="450" stroke="#241205" stroke-width="10"/>

    <!-- archway pilasters to parlor -->
    <rect x="344" y="246" width="12" height="20" fill="#caa257"/>
    <rect x="344" y="384" width="12" height="20" fill="#caa257"/>

    <!-- front doors, opened outward to the left -->
    <g stroke="#caa257" stroke-width="3" fill="none">
      <path d="M90,280 L90,236 L60,236"/>
      <path d="M90,360 L90,404 L60,404"/>
      <path d="M60,236 A44,44 0 0 0 90,280" opacity="0.5"/>
      <path d="M60,404 A44,44 0 0 1 90,360" opacity="0.5"/>
    </g>
    <text x="34" y="320" font-size="13" fill="#f3d38a" font-family="Georgia, serif" font-style="italic" transform="rotate(-90 34 320)">front doors &#8594; Garden Path</text>

    <use href="#grandstairs" x="300" y="330" transform="scale(0.62)" />
    <text x="300" y="250" text-anchor="middle" fill="#f3d38a" font-size="13" font-family="Georgia, serif" font-style="italic">stairs up to Hallway</text>

    <rect x="150" y="330" width="90" height="70" rx="35" fill="#7f1d1d" opacity="0.4" stroke="#caa257" stroke-width="1.2"/>

    <rect x="103" y="182" width="150" height="46" rx="8" fill="#0f172a" opacity="0.55"/>
    <text x="118" y="206" fill="#f1e6c8" font-size="28" font-family="Georgia, 'Times New Roman', serif">Foyer</text>
    <text x="118" y="223" fill="#c9a66b" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Central entrance hall</text>
  </g>

  <!-- ============= PARLOR ============= -->
  <g>
    <rect x="350" y="170" width="260" height="280" fill="url(#planks)"/>
    <rect x="350" y="170" width="260" height="280" fill="#7f1d1d" opacity="0.1"/>
    <line x1="350" y1="170" x2="610" y2="170" stroke="#241205" stroke-width="10"/>
    <line x1="350" y1="170" x2="610" y2="170" stroke="#caa257" stroke-width="2" opacity="0.5"/>
    <line x1="610" y1="170" x2="610" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="610" y1="170" x2="610" y2="450" stroke="#caa257" stroke-width="2" opacity="0.5"/>
    <line x1="350" y1="450" x2="610" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="350" y1="450" x2="610" y2="450" stroke="#caa257" stroke-width="2" opacity="0.5"/>

    <use href="#fireplace" x="580" y="260" transform="rotate(90 580 260)"/>
    <rect x="430" y="340" width="110" height="70" rx="10" fill="#7f1d1d" opacity="0.45" stroke="#caa257" stroke-width="1.2"/>
    <use href="#sofa" x="485" y="400"/>
    <use href="#armchair" x="400" y="330"/>
    <use href="#armchair" x="565" y="330"/>

    <rect x="363" y="182" width="150" height="46" rx="8" fill="#0f172a" opacity="0.55"/>
    <text x="378" y="206" fill="#f1e6c8" font-size="28" font-family="Georgia, 'Times New Roman', serif">Parlor</text>
    <text x="378" y="223" fill="#c9a66b" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Social sitting room</text>
  </g>

  <!-- ============= KITCHEN ============= -->
  <g>
    <rect x="610" y="170" width="280" height="280" fill="url(#planks)"/>
    <rect x="610" y="170" width="280" height="280" fill="#3f6212" opacity="0.12"/>
    <line x1="610" y1="170" x2="890" y2="170" stroke="#241205" stroke-width="10"/>
    <line x1="610" y1="170" x2="890" y2="170" stroke="#caa257" stroke-width="2" opacity="0.5"/>
    <line x1="890" y1="170" x2="890" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="890" y1="170" x2="890" y2="450" stroke="#caa257" stroke-width="2" opacity="0.5"/>
    <!-- bottom wall with two gaps: hall (630-700) and stairs (760-840) -->
    <line x1="610" y1="450" x2="630" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="700" y1="450" x2="760" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="840" y1="450" x2="890" y2="450" stroke="#241205" stroke-width="10"/>

    <use href="#cabinet" x="700" y="192"/>
    <use href="#cabinet" x="820" y="192"/>
    <use href="#diningtable" x="750" y="300"/>
    <use href="#fireplace" x="630" y="330" transform="rotate(90 630 330)"/>

    <rect x="623" y="182" width="150" height="46" rx="8" fill="#0f172a" opacity="0.55"/>
    <text x="638" y="206" fill="#f1e6c8" font-size="28" font-family="Georgia, 'Times New Roman', serif">Kitchen</text>
    <text x="638" y="223" fill="#c9a66b" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Service heart of the house</text>
  </g>

  <!-- ============= SERVICE HALL (foyer <-> kitchen, long route) ============= -->
  <g>
    <rect x="90" y="450" width="800" height="70" fill="url(#planks)"/>
    <rect x="90" y="450" width="800" height="70" fill="#0f172a" opacity="0.25"/>
    <line x1="90" y1="520" x2="890" y2="520" stroke="#241205" stroke-width="10"/>
    <line x1="90" y1="520" x2="890" y2="520" stroke="#caa257" stroke-width="2" opacity="0.4"/>
    <!-- top wall solid except the two doorway gaps already cut above -->
    <line x1="90" y1="450" x2="170" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="260" y1="450" x2="630" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="700" y1="450" x2="890" y2="450" stroke="#241205" stroke-width="10"/>
    <line x1="90" y1="450" x2="90" y2="520" stroke="#241205" stroke-width="10"/>

    <path d="M170,450 A45,45 0 0 0 215,495" fill="none" stroke="#caa257" stroke-width="1.5"/>
    <path d="M630,450 A45,45 0 0 1 675,495" fill="none" stroke="#caa257" stroke-width="1.5"/>

    <use href="#lantern" x="300" y="485"/>
    <use href="#lantern" x="480" y="485"/>
    <use href="#lantern" x="660" y="485"/>
    <text x="480" y="497" text-anchor="middle" fill="#c9a66b" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Service Hall &#8212; the long way round</text>
  </g>

  <!-- ============= STAIR SHAFT: kitchen -> wine cellar ============= -->
  <g>
    <rect x="760" y="450" width="80" height="170" fill="url(#planks)"/>
    <rect x="760" y="450" width="80" height="170" fill="#0f172a" opacity="0.4"/>
    <line x1="760" y1="450" x2="760" y2="620" stroke="#241205" stroke-width="8"/>
    <line x1="840" y1="450" x2="840" y2="620" stroke="#241205" stroke-width="8"/>
    <line x1="760" y1="450" x2="760" y2="620" stroke="#caa257" stroke-width="1.5" opacity="0.5"/>
    <line x1="840" y1="450" x2="840" y2="620" stroke="#caa257" stroke-width="1.5" opacity="0.5"/>
    <use href="#stairsdown" x="800" y="500" transform="rotate(90 800 500)"/>
    <text x="800" y="580" text-anchor="middle" fill="#f3d38a" font-size="12" font-family="Georgia, serif" font-style="italic">stairs down</text>
  </g>

  <!-- ============= WINE CELLAR ============= -->
  <g>
    <rect x="690" y="580" width="200" height="140" fill="url(#stone)"/>
    <rect x="690" y="580" width="200" height="140" fill="#450a0a" opacity="0.12"/>
    <line x1="690" y1="580" x2="760" y2="580" stroke="#241205" stroke-width="10"/>
    <line x1="840" y1="580" x2="890" y2="580" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="720" x2="890" y2="720" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="580" x2="690" y2="720" stroke="#241205" stroke-width="10"/>
    <line x1="890" y1="580" x2="890" y2="720" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="720" x2="890" y2="720" stroke="#caa257" stroke-width="2" opacity="0.4"/>

    <use href="#winerack" x="725" y="650" transform="scale(0.62)"/>
    <use href="#winerack" x="855" y="650" transform="scale(0.62)"/>
    <use href="#lantern" x="790" y="610"/>

    <rect x="700" y="588" width="180" height="42" rx="8" fill="#0f172a" opacity="0.6"/>
    <text x="712" y="608" fill="#fef3c7" font-size="22" font-family="Georgia, 'Times New Roman', serif">Wine Cellar</text>
    <text x="712" y="624" fill="#fcd34d" font-size="12" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Isolated, high-risk basement</text>
  </g>

  <!-- compass rose -->
  <g transform="translate(1100,690)">
    <circle r="30" fill="#111827" stroke="url(#gilt)" stroke-width="3"/>
    <path d="M0,-21 L6,4 L0,-5 L-6,4 Z" fill="#f3d38a"/>
    <text x="0" y="-27" text-anchor="middle" fill="#f3d38a" font-size="12" font-family="Georgia, serif">N</text>
  </g>

  <rect width="1200" height="780" fill="url(#vignette)"/>
</svg>
