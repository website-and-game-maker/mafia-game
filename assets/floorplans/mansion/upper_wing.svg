<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780">
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e6b0"/>
      <stop offset="0.5" stop-color="#b8860b"/>
      <stop offset="1" stop-color="#5c3d0a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="planks" width="60" height="16" patternUnits="userSpaceOnUse">
      <rect width="60" height="16" fill="#6b4423"/>
      <line x1="0" y1="16" x2="60" y2="16" stroke="#4a2f18" stroke-width="1"/>
      <line x1="18" y1="0" x2="18" y2="16" stroke="#4a2f18" stroke-width="0.6" opacity="0.6"/>
      <line x1="40" y1="0" x2="40" y2="16" stroke="#4a2f18" stroke-width="0.6" opacity="0.6"/>
    </pattern>
    <g id="bed">
      <rect x="-34" y="-49" width="68" height="98" fill="none" stroke="#caa257" stroke-width="1" opacity="0.6"/>
      <rect x="-30" y="-45" width="60" height="90" rx="4" fill="#7f1d1d" stroke="#3f0d0d" stroke-width="2"/>
      <rect x="-30" y="-45" width="60" height="22" fill="#f1e6c8" opacity="0.85"/>
      <circle cx="-26" cy="-41" r="4.5" fill="#2a1608"/>
      <circle cx="26" cy="-41" r="4.5" fill="#2a1608"/>
      <circle cx="-26" cy="41" r="4.5" fill="#2a1608"/>
      <circle cx="26" cy="41" r="4.5" fill="#2a1608"/>
    </g>
    <g id="nightstand">
      <rect x="-11" y="-11" width="22" height="22" rx="3" fill="#5c3d0a" stroke="#2a1608" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="url(#glow)"/>
    </g>
    <g id="armchair">
      <rect x="-20" y="-18" width="40" height="36" rx="9" fill="#78350f" stroke="#2a1608" stroke-width="2"/>
      <rect x="-24" y="-8" width="8" height="22" rx="4" fill="#5c3d0a" stroke="#2a1608" stroke-width="1"/>
      <rect x="16" y="-8" width="8" height="22" rx="4" fill="#5c3d0a" stroke="#2a1608" stroke-width="1"/>
    </g>
    <g id="sconce">
      <circle r="10" fill="url(#glow)"/>
      <circle r="3.5" fill="#fde68a"/>
    </g>
    <g id="bookshelf">
      <rect x="-42" y="-15" width="84" height="30" fill="#3b2412" stroke="#1f1408" stroke-width="2"/>
      <rect x="-38" y="-11" width="6" height="22" fill="#7f1d1d"/>
      <rect x="-29" y="-11" width="6" height="22" fill="#3f6212"/>
      <rect x="-20" y="-11" width="6" height="22" fill="#78350f"/>
      <rect x="-11" y="-11" width="6" height="22" fill="#1e3a8a"/>
      <rect x="-2" y="-11" width="6" height="22" fill="#7f1d1d"/>
      <rect x="7" y="-11" width="6" height="22" fill="#3f6212"/>
      <rect x="16" y="-11" width="6" height="22" fill="#78350f"/>
      <rect x="25" y="-11" width="6" height="22" fill="#1e3a8a"/>
      <rect x="34" y="-11" width="6" height="22" fill="#7f1d1d"/>
    </g>
    <g id="stairs">
      <rect x="-26" y="8" width="52" height="6" fill="#94a3b8"/>
      <rect x="-19" y="0" width="38" height="6" fill="#94a3b8"/>
      <rect x="-12" y="-8" width="24" height="6" fill="#94a3b8"/>
      <rect x="-5" y="-16" width="10" height="6" fill="#94a3b8"/>
      <path d="M0,14 L0,30 M0,30 L-6,22 M0,30 L6,22" stroke="#e2e8f0" stroke-width="2.5" fill="none"/>
    </g>
  </defs>

  <rect width="1200" height="780" fill="#0f172a"/>

  <!-- decorative gilt frame -->
  <rect x="20" y="20" width="1160" height="740" rx="24" fill="none" stroke="url(#gilt)" stroke-width="6"/>
  <rect x="34" y="34" width="1132" height="712" rx="16" fill="none" stroke="#5c3d0a" stroke-width="1.5" opacity="0.6"/>
  <circle cx="34" cy="34" r="5" fill="url(#gilt)"/><circle cx="1166" cy="34" r="5" fill="url(#gilt)"/>
  <circle cx="34" cy="746" r="5" fill="url(#gilt)"/><circle cx="1166" cy="746" r="5" fill="url(#gilt)"/>

  <text x="600" y="70" text-anchor="middle" fill="#f3e3b3" font-size="34" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Blackwood Estate &#8212; Upper Wing</text>
  <text x="600" y="96" text-anchor="middle" fill="#c9a66b" font-size="16" font-family="Georgia, 'Times New Roman', serif">Second Floor &#183; Sleeping Quarters</text>

  <!-- ============= BEDROOM WING ============= -->
  <g>
    <path d="M90,170 L470,170 L470,610 L90,610 L90,380 L50,360 L50,280 L90,260 Z" fill="url(#planks)"/>
    <path d="M90,170 L470,170 L470,610 L90,610 L90,380 L50,360 L50,280 L90,260 Z" fill="#7f1d1d" opacity="0.1"/>
    <path d="M90,170 L470,170 L470,610 L90,610 L90,380 L50,360 L50,280 L90,260 Z" fill="none" stroke="#241205" stroke-width="10" stroke-linecap="square"/>
    <path d="M90,170 L470,170 L470,610 L90,610 L90,380 L50,360 L50,280 L90,260 Z" fill="none" stroke="#caa257" stroke-width="2" opacity="0.5"/>
    <!-- door gap to hallway -->
    <rect x="464" y="350" width="16" height="60" fill="url(#planks)"/>
    <path d="M470,350 A60,60 0 0 1 530,410" fill="none" stroke="#caa257" stroke-width="1.5"/>
    <path d="M470,410 L530,410" stroke="#e2e8f0" stroke-width="3"/>
    <!-- bay window glass -->
    <rect x="46" y="284" width="10" height="72" fill="#8ecbe8" opacity="0.5" stroke="#caa257" stroke-width="1.5"/>
    <text x="18" y="330" font-size="13" fill="#c9a66b" font-family="Georgia, serif" transform="rotate(-90 18 330)">balcony doors</text>
    <text x="30" y="435" font-size="13" fill="#f3d38a" font-family="Georgia, serif" font-style="italic">&#8593; balcony to grounds below</text>

    <!-- partitions suggesting several bedroom doors -->
    <line x1="210" y1="170" x2="210" y2="430" stroke="#4a2f18" stroke-width="4" stroke-dasharray="10 6"/>
    <path d="M210,430 A18,18 0 0 0 228,448" fill="none" stroke="#caa257" stroke-width="1.2"/>
    <line x1="340" y1="170" x2="340" y2="430" stroke="#4a2f18" stroke-width="4" stroke-dasharray="10 6"/>
    <path d="M340,430 A18,18 0 0 0 358,448" fill="none" stroke="#caa257" stroke-width="1.2"/>

    <use href="#bed" x="150" y="270"/>
    <use href="#nightstand" x="195" y="230"/>
    <use href="#bed" x="275" y="270"/>
    <use href="#nightstand" x="320" y="230"/>
    <use href="#bed" x="405" y="270"/>
    <use href="#nightstand" x="440" y="230"/>

    <!-- shared sitting nook -->
    <rect x="130" y="470" width="220" height="100" rx="6" fill="#5c1a1a" opacity="0.4"/>
    <use href="#armchair" x="170" y="520"/>
    <use href="#armchair" x="310" y="520" transform="rotate(180 310 520)"/>

    <rect x="105" y="182" width="230" height="56" rx="8" fill="#0f172a" opacity="0.55"/>
    <text x="118" y="206" fill="#f1e6c8" font-size="28" font-family="Georgia, 'Times New Roman', serif">Bedroom Wing</text>
    <text x="118" y="228" fill="#c9a66b" font-size="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Several doors off a shared corridor</text>
  </g>

  <!-- ============= HALLWAY ============= -->
  <g>
    <rect x="470" y="170" width="220" height="440" fill="url(#planks)"/>
    <rect x="470" y="170" width="220" height="440" fill="#334155" opacity="0.12"/>
    <line x1="470" y1="170" x2="690" y2="170" stroke="#241205" stroke-width="10"/>
    <line x1="470" y1="610" x2="690" y2="610" stroke="#241205" stroke-width="10"/>
    <line x1="470" y1="170" x2="470" y2="350" stroke="#241205" stroke-width="10"/>
    <line x1="470" y1="410" x2="470" y2="610" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="170" x2="690" y2="350" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="410" x2="690" y2="610" stroke="#241205" stroke-width="10"/>
    <line x1="470" y1="170" x2="690" y2="170" stroke="#caa257" stroke-width="2" opacity="0.5"/>
    <line x1="470" y1="610" x2="690" y2="610" stroke="#caa257" stroke-width="2" opacity="0.5"/>

    <!-- door swing hallway<->library -->
    <rect x="684" y="350" width="16" height="60" fill="url(#planks)"/>
    <path d="M690,350 A60,60 0 0 1 750,410" fill="none" stroke="#caa257" stroke-width="1.5"/>
    <path d="M690,410 L750,410" stroke="#e2e8f0" stroke-width="3"/>

    <!-- runner rug -->
    <rect x="510" y="200" width="140" height="360" rx="8" fill="#7f1d1d" opacity="0.55" stroke="#caa257" stroke-width="1.5"/>
    <line x1="510" y1="220" x2="650" y2="220" stroke="#caa257" stroke-width="1" opacity="0.4"/>
    <line x1="510" y1="540" x2="650" y2="540" stroke="#caa257" stroke-width="1" opacity="0.4"/>

    <use href="#sconce" x="480" y="220"/>
    <use href="#sconce" x="480" y="340"/>
    <use href="#sconce" x="480" y="460"/>
    <use href="#sconce" x="680" y="220"/>
    <use href="#sconce" x="680" y="340"/>
    <use href="#sconce" x="680" y="460"/>

    <rect x="500" y="182" width="160" height="46" rx="8" fill="#0f172a" opacity="0.55"/>
    <text x="580" y="203" text-anchor="middle" fill="#f1e6c8" font-size="25" font-family="Georgia, 'Times New Roman', serif">Hallway</text>
    <text x="580" y="221" text-anchor="middle" fill="#c9a66b" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Main night traffic spine</text>

    <use href="#stairs" x="580" y="555"/>
    <text x="580" y="590" text-anchor="middle" fill="#f3d38a" font-size="13" font-family="Georgia, serif" font-style="italic">stairs down to Foyer</text>
  </g>

  <!-- ============= LIBRARY STACKS ============= -->
  <g>
    <rect x="690" y="170" width="390" height="440" fill="url(#planks)"/>
    <rect x="690" y="170" width="390" height="440" fill="#1e293b" opacity="0.2"/>
    <line x1="690" y1="170" x2="1080" y2="170" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="610" x2="1080" y2="610" stroke="#241205" stroke-width="10"/>
    <line x1="1080" y1="170" x2="1080" y2="610" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="170" x2="690" y2="350" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="410" x2="690" y2="610" stroke="#241205" stroke-width="10"/>
    <line x1="690" y1="170" x2="1080" y2="170" stroke="#caa257" stroke-width="2" opacity="0.5"/>
    <line x1="1080" y1="170" x2="1080" y2="610" stroke="#caa257" stroke-width="2" opacity="0.5"/>

    <use href="#bookshelf" x="770" y="192"/>
    <use href="#bookshelf" x="870" y="192"/>
    <use href="#bookshelf" x="970" y="192"/>
    <use href="#bookshelf" x="1055" y="260" transform="rotate(90 1055 260)"/>
    <use href="#bookshelf" x="1055" y="360" transform="rotate(90 1055 360)"/>
    <use href="#bookshelf" x="1055" y="460" transform="rotate(90 1055 460)"/>

    <!-- reading nook -->
    <rect x="730" y="500" width="130" height="90" rx="6" fill="#3b2412" opacity="0.5"/>
    <use href="#armchair" x="770" y="555"/>
    <circle cx="825" cy="555" r="14" fill="#5c3d0a" stroke="#2a1608" stroke-width="1.5"/>

    <rect x="850" y="182" width="220" height="56" rx="8" fill="#0f172a" opacity="0.55"/>
    <text x="865" y="206" fill="#f1e6c8" font-size="28" font-family="Georgia, 'Times New Roman', serif">Library Stacks</text>
    <text x="865" y="228" fill="#c9a66b" font-size="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Quiet snoop vantage</text>
  </g>

  <!-- compass rose -->
  <g transform="translate(1100,690)">
    <circle r="30" fill="#111827" stroke="url(#gilt)" stroke-width="3"/>
    <path d="M0,-21 L6,4 L0,-5 L-6,4 Z" fill="#f3d38a"/>
    <text x="0" y="-27" text-anchor="middle" fill="#f3d38a" font-size="12" font-family="Georgia, serif">N</text>
  </g>

  <rect width="1200" height="780" fill="url(#vignette)"/>
</svg>
