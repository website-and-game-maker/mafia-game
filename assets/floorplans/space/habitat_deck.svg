<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 740">
  <defs>
    <radialGradient id="hBgGlow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#0b2a45" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hStars" width="140" height="140" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.4" fill="#bae6fd" opacity="0.6"/>
      <circle cx="64" cy="52" r="1" fill="#e0f2fe" opacity="0.4"/>
      <circle cx="102" cy="14" r="1.6" fill="#7dd3fc" opacity="0.5"/>
      <circle cx="40" cy="96" r="1" fill="#bae6fd" opacity="0.35"/>
      <circle cx="120" cy="108" r="1.5" fill="#e0f2fe" opacity="0.5"/>
      <circle cx="80" cy="130" r="1" fill="#7dd3fc" opacity="0.4"/>
    </pattern>
    <pattern id="hGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
    <linearGradient id="hMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="hRoomFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123350"/>
      <stop offset="1" stop-color="#08192b"/>
    </linearGradient>
    <linearGradient id="hRoomFillAlt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0a1e33"/>
    </linearGradient>
    <radialGradient id="hRingFill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#173a5e"/>
      <stop offset="1" stop-color="#081b2e"/>
    </radialGradient>
    <radialGradient id="hVignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.6" stop-color="#020617" stop-opacity="0"/>
      <stop offset="1" stop-color="#000208" stop-opacity="0.6"/>
    </radialGradient>
    <mask id="hRingMask" maskUnits="userSpaceOnUse">
      <circle cx="890" cy="480" r="205" fill="#fff"/>
      <circle cx="890" cy="480" r="115" fill="#000"/>
    </mask>
    <g id="hRivet">
      <circle r="4.2" fill="url(#hMetal)"/>
      <circle r="1.4" fill="#0c4a6e"/>
    </g>
    <g id="hPod">
      <rect x="-20" y="-38" width="40" height="76" rx="14" fill="#0c2436" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="0" cy="-15" rx="11" ry="14" fill="#7dd3fc" opacity="0.5"/>
      <line x1="-13" y1="15" x2="13" y2="15" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
      <line x1="-13" y1="26" x2="13" y2="26" stroke="#38bdf8" stroke-width="1.4" opacity="0.6"/>
    </g>
    <g id="hHatch">
      <rect x="-16" y="-22" width="32" height="44" fill="#0b1c2e" stroke="url(#hMetal)" stroke-width="2.5"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="url(#hMetal)" stroke-width="2"/>
      <use href="#hRivet" x="-12" y="-16"/><use href="#hRivet" x="12" y="-16"/>
      <use href="#hRivet" x="-12" y="16"/><use href="#hRivet" x="12" y="16"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1140" height="740" fill="#020617"/>
  <rect width="1140" height="740" fill="url(#hStars)"/>
  <rect width="1140" height="740" fill="url(#hGrid)"/>
  <rect width="1140" height="740" fill="url(#hBgGlow)"/>

  <!-- decorative frame -->
  <rect x="14" y="14" width="1112" height="712" rx="18" fill="none" stroke="url(#hMetal)" stroke-width="5"/>
  <rect x="25" y="25" width="1090" height="690" rx="12" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.55"/>
  <use href="#hRivet" x="36" y="36"/>
  <use href="#hRivet" x="1104" y="36"/>
  <use href="#hRivet" x="36" y="704"/>
  <use href="#hRivet" x="1104" y="704"/>

  <!-- title card -->
  <text x="50" y="62" fill="#7dd3fc" font-size="34" font-family="'Courier New', ui-monospace, monospace" font-weight="bold" letter-spacing="1">PROMETHEUS STATION</text>
  <text x="52" y="90" fill="#94a3b8" font-size="18" font-family="'Courier New', ui-monospace, monospace" letter-spacing="3">HABITAT DECK &#8226; SCHEMATIC 02-A</text>

  <!-- orientation marker -->
  <g transform="translate(1058,72)">
    <circle r="38" fill="#08131f" stroke="url(#hMetal)" stroke-width="2.5"/>
    <circle r="26" fill="none" stroke="#0e7490" stroke-width="1" opacity="0.7"/>
    <path d="M0,-30 L7,-6 L0,-14 L-7,-6 Z" fill="#7dd3fc"/>
    <text x="0" y="-40" text-anchor="middle" fill="#7dd3fc" font-size="13" font-family="'Courier New', monospace">FWD</text>
    <text x="0" y="50" text-anchor="middle" fill="#64748b" font-size="12" font-family="'Courier New', monospace">AFT</text>
  </g>

  <!-- ================= SLEEP POD DECK ================= -->
  <g>
    <path d="M107,335 L343,335 L375,367 L375,593 L343,625 L107,625 L75,593 L75,367 Z"
          fill="url(#hRoomFill)" stroke="url(#hMetal)" stroke-width="4"/>
    <use href="#hRivet" x="107" y="335"/><use href="#hRivet" x="343" y="335"/>
    <use href="#hRivet" x="107" y="625"/><use href="#hRivet" x="343" y="625"/>

    <text x="225" y="375" text-anchor="middle" fill="#e0f2fe" font-size="28" font-family="'Courier New', ui-monospace, monospace" font-weight="bold">Sleep Pod Deck</text>
    <text x="225" y="398" text-anchor="middle" fill="#7dd3fc" font-size="15" font-family="'Courier New', ui-monospace, monospace" opacity="0.85">rows of crew sleep pods</text>

    <!-- pod rows -->
    <g>
      <use href="#hPod" x="130" y="450"/><use href="#hPod" x="185" y="450"/>
      <use href="#hPod" x="240" y="450"/><use href="#hPod" x="295" y="450"/><use href="#hPod" x="350" y="450"/>
      <use href="#hPod" x="130" y="545"/><use href="#hPod" x="185" y="545"/>
      <use href="#hPod" x="240" y="545"/><use href="#hPod" x="295" y="545"/><use href="#hPod" x="350" y="545"/>
    </g>
    <line x1="95" y1="500" x2="360" y2="500" stroke="#1e3a5f" stroke-width="1" opacity="0.7" stroke-dasharray="4 4"/>

    <!-- cross-deck hint: bulkhead to Operations Deck -->
    <g transform="translate(225,660)">
      <use href="#hHatch" x="-115" y="0"/>
      <text x="-90" y="7" fill="#fbbf24" font-size="17" font-family="'Courier New', ui-monospace, monospace">&#8681; bulkhead to Operations Deck</text>
    </g>
  </g>

  <!-- ================= CATWALK CONNECTOR ================= -->
  <g stroke="#38bdf8" stroke-width="3">
    <line x1="378" y1="355" x2="427" y2="300"/>
    <line x1="378" y1="385" x2="452" y2="330"/>
    <line x1="392" y1="372" x2="404" y2="358"/>
    <line x1="404" y1="386" x2="416" y2="372"/>
    <line x1="416" y1="400" x2="428" y2="386"/>
  </g>
  <text x="410" y="425" fill="#64748b" font-size="14" font-family="'Courier New', ui-monospace, monospace">catwalk</text>

  <!-- ================= POD LOOKOUT ================= -->
  <g>
    <path d="M456,170 L664,170 L690,196 L690,324 L664,350 L456,350 L430,324 L430,196 Z"
          fill="url(#hRoomFillAlt)" stroke="url(#hMetal)" stroke-width="4"/>
    <use href="#hRivet" x="456" y="170"/><use href="#hRivet" x="664" y="170"/>
    <use href="#hRivet" x="456" y="350"/><use href="#hRivet" x="664" y="350"/>

    <text x="560" y="222" text-anchor="middle" fill="#e0f2fe" font-size="26" font-family="'Courier New', ui-monospace, monospace" font-weight="bold">Pod Lookout</text>
    <text x="560" y="244" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="'Courier New', ui-monospace, monospace" opacity="0.85">elevated catwalk over the deck</text>

    <!-- grating / railing texture -->
    <g stroke="#0e7490" stroke-width="2" opacity="0.8">
      <line x1="460" y1="270" x2="686" y2="270"/>
      <line x1="470" y1="290" x2="676" y2="290"/>
      <line x1="470" y1="310" x2="676" y2="310"/>
    </g>
    <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
      <line x1="480" y1="270" x2="480" y2="310"/><line x1="510" y1="270" x2="510" y2="310"/>
      <line x1="540" y1="270" x2="540" y2="310"/><line x1="570" y1="270" x2="570" y2="310"/>
      <line x1="600" y1="270" x2="600" y2="310"/><line x1="630" y1="270" x2="630" y2="310"/>
      <line x1="660" y1="270" x2="660" y2="310"/>
    </g>
    <!-- lookout scope icon -->
    <g transform="translate(560,255)" stroke="#bae6fd" stroke-width="2.4" fill="none">
      <circle cx="-11" cy="0" r="9"/><circle cx="11" cy="0" r="9"/>
      <line x1="-2" y1="0" x2="2" y2="0"/>
    </g>
  </g>

  <!-- ================= OBSERVATION RING ================= -->
  <g>
    <circle cx="890" cy="480" r="205" fill="url(#hRingFill)" stroke="none" mask="url(#hRingMask)"/>
    <circle cx="890" cy="480" r="205" fill="none" stroke="url(#hMetal)" stroke-width="4"/>
    <circle cx="890" cy="480" r="115" fill="none" stroke="url(#hMetal)" stroke-width="3"/>

    <!-- viewport windows around the ring -->
    <g fill="#bae6fd" opacity="0.55" stroke="#0c4a6e" stroke-width="1.5">
      <rect x="875" y="285" width="30" height="20" rx="4" transform="rotate(0 890 480)"/>
      <rect x="875" y="285" width="30" height="20" rx="4" transform="rotate(50 890 480)"/>
      <rect x="875" y="285" width="30" height="20" rx="4" transform="rotate(100 890 480)"/>
      <rect x="875" y="285" width="30" height="20" rx="4" transform="rotate(150 890 480)"/>
      <rect x="875" y="285" width="30" height="20" rx="4" transform="rotate(210 890 480)"/>
      <rect x="875" y="285" width="30" height="20" rx="4" transform="rotate(260 890 480)"/>
      <rect x="875" y="285" width="30" height="20" rx="4" transform="rotate(310 890 480)"/>
    </g>

    <text x="890" y="342" text-anchor="middle" fill="#e0f2fe" font-size="27" font-family="'Courier New', ui-monospace, monospace" font-weight="bold">Observation Ring</text>
    <text x="890" y="365" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="'Courier New', ui-monospace, monospace" opacity="0.85">shared ring corridor &#8226; wide viewports</text>

    <!-- cross-deck hints along lower band -->
    <text x="790" y="596" text-anchor="middle" fill="#fbbf24" font-size="15" font-family="'Courier New', ui-monospace, monospace">&#8660; ring passage to Ops</text>
    <text x="992" y="596" text-anchor="middle" fill="#fbbf24" font-size="15" font-family="'Courier New', ui-monospace, monospace">&#8660; lock corridor to</text>
    <text x="992" y="614" text-anchor="middle" fill="#fbbf24" font-size="15" font-family="'Courier New', ui-monospace, monospace">Engineering</text>
  </g>

  <rect width="1140" height="740" fill="url(#hVignette)"/>
</svg>
