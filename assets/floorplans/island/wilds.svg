<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <defs>
    <linearGradient id="nightSkyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a2f"/>
      <stop offset="0.5" stop-color="#14261f"/>
      <stop offset="1" stop-color="#0b1a15"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c68a4e"/>
      <stop offset="1" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="woodFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b87a"/>
      <stop offset="0.5" stop-color="#a5672f"/>
      <stop offset="1" stop-color="#5c3417"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78716c"/>
      <stop offset="1" stop-color="#44403c"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.7"/>
    </radialGradient>

    <g id="palm">
      <path d="M0,0 C-6,-26 6,-46 -3,-72 C-8,-84 2,-96 -4,-108" fill="none" stroke="#7a4a23" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-4,-108)" fill="#1f8a4c" stroke="#166534" stroke-width="1">
        <path d="M0,0 C-30,-18 -62,-14 -82,6 C-54,-2 -26,-2 0,0 Z"/>
        <path d="M0,0 C-24,-32 -48,-46 -74,-48 C-46,-32 -22,-16 0,0 Z"/>
        <path d="M0,0 C-6,-36 -18,-58 -40,-72 C-22,-50 -10,-24 0,0 Z"/>
        <path d="M0,0 C6,-36 18,-58 40,-72 C22,-50 10,-24 0,0 Z"/>
        <path d="M0,0 C24,-32 48,-46 74,-48 C46,-32 22,-16 0,0 Z"/>
        <path d="M0,0 C30,-18 62,-14 82,6 C54,-2 26,-2 0,0 Z"/>
      </g>
    </g>

    <g id="canopy">
      <circle r="46" fill="#14532d" stroke="#0a3319" stroke-width="2"/>
      <circle cx="-18" cy="-10" r="26" fill="#166534" stroke="#0a3319" stroke-width="1.5"/>
      <circle cx="20" cy="-6" r="30" fill="#1f8a4c" stroke="#0a3319" stroke-width="1.5"/>
      <circle cx="4" cy="16" r="24" fill="#166534" stroke="#0a3319" stroke-width="1.5"/>
    </g>

    <g id="vine">
      <path d="M0,0 Q10,20 0,40 Q-10,60 0,80" fill="none" stroke="#276b3c" stroke-width="3" opacity="0.7"/>
    </g>

    <g id="lookout">
      <line x1="-22" y1="30" x2="-22" y2="-40" stroke="#5c3417" stroke-width="6"/>
      <line x1="22" y1="30" x2="22" y2="-40" stroke="#5c3417" stroke-width="6"/>
      <line x1="-22" y1="0" x2="22" y2="-16" stroke="#5c3417" stroke-width="3" opacity="0.7"/>
      <line x1="-22" y1="-16" x2="22" y2="0" stroke="#5c3417" stroke-width="3" opacity="0.7"/>
      <rect x="-34" y="-64" width="68" height="28" fill="url(#deckGrad)" stroke="#4a2c12" stroke-width="2"/>
      <rect x="-34" y="-92" width="68" height="30" fill="none" stroke="#4a2c12" stroke-width="3"/>
      <line x1="-34" y1="-78" x2="34" y2="-78" stroke="#4a2c12" stroke-width="2" opacity="0.6"/>
      <line x1="-17" y1="-92" x2="-17" y2="-64" stroke="#4a2c12" stroke-width="2" opacity="0.6"/>
      <line x1="17" y1="-92" x2="17" y2="-64" stroke="#4a2c12" stroke-width="2" opacity="0.6"/>
    </g>

    <g id="lighthouse">
      <rect x="-24" y="-150" width="48" height="150" fill="#e7e5e4" stroke="#57534e" stroke-width="2.5"/>
      <rect x="-24" y="-150" width="48" height="26" fill="#dc2626" stroke="#57534e" stroke-width="2"/>
      <rect x="-24" y="-98" width="48" height="26" fill="#dc2626" stroke="#57534e" stroke-width="2"/>
      <rect x="-24" y="-46" width="48" height="26" fill="#dc2626" stroke="#57534e" stroke-width="2"/>
      <rect x="-30" y="-176" width="60" height="26" rx="4" fill="#44403c" stroke="#1c1917" stroke-width="2"/>
      <circle cx="0" cy="-186" r="14" fill="#fde68a" stroke="#1c1917" stroke-width="2"/>
      <path d="M-12,-198 L12,-198 L4,-176 L-4,-176 Z" fill="#57534e" stroke="#1c1917" stroke-width="1.5"/>
    </g>

    <g id="knot">
      <circle r="9" fill="#6b4423" stroke="#3f2510" stroke-width="2"/>
      <path d="M-6,-6 L6,6 M-6,6 L6,-6" stroke="#3f2510" stroke-width="1.5"/>
    </g>

    <g id="tuft">
      <path d="M-6,0 Q-4,-14 0,-2 Q4,-14 6,0 Q0,-6 -6,0 Z" fill="#3f7d32" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1000" height="650" fill="#0f172a"/>

  <!-- decorative wood-plank frame -->
  <rect x="14" y="14" width="972" height="622" rx="22" fill="none" stroke="url(#woodFrame)" stroke-width="6"/>
  <rect x="26" y="26" width="948" height="598" rx="16" fill="url(#nightSkyGrad)"/>
  <rect x="26" y="26" width="948" height="598" rx="16" fill="none" stroke="#5c3417" stroke-width="1.5" opacity="0.6"/>
  <use href="#knot" x="30" y="30"/>
  <use href="#knot" x="970" y="30"/>
  <use href="#knot" x="30" y="620"/>
  <use href="#knot" x="970" y="620"/>

  <g fill="#e2e8f0" opacity="0.5">
    <circle cx="130" cy="60" r="1.3"/><circle cx="280" cy="45" r="1"/><circle cx="450" cy="65" r="1.2"/>
    <circle cx="620" cy="48" r="1"/><circle cx="780" cy="60" r="1.3"/><circle cx="900" cy="46" r="1"/>
  </g>

  <text x="500" y="62" text-anchor="middle" fill="#fef3c7" font-size="34" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Coral Bay &#8212; Wilds</text>
  <text x="500" y="86" text-anchor="middle" fill="#a7d8b8" font-size="15" font-family="Georgia, 'Times New Roman', serif">Dorm Overlook &#183; Jungle Edge &#183; Lighthouse</text>

  <!-- compass -->
  <g transform="translate(925,95)">
    <circle r="30" fill="#0b1120" stroke="url(#woodFrame)" stroke-width="3"/>
    <path d="M0,-20 L6,4 L0,-4 L-6,4 Z" fill="#fef3c7"/>
    <text x="0" y="-25" fill="#fef3c7" font-size="11" text-anchor="middle" font-family="Georgia, serif">N</text>
  </g>

  <!-- ================= DORM OVERLOOK ================= -->
  <g>
    <path d="M60,150 L330,150 Q356,150 356,176 L356,550 Q356,576 330,576 L86,576 Q60,576 60,550 Z" fill="#1a4d2b" stroke="#0f3320" stroke-width="4"/>
    <rect x="76" y="184" width="220" height="56" rx="8" fill="#0f172a" opacity="0.6"/>
    <text x="90" y="208" fill="#f1f5f4" font-size="26" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Dorm Overlook</text>
    <text x="90" y="230" fill="#a7d8b8" font-size="13" font-family="Georgia, 'Times New Roman', serif">a lookout over the inner paths</text>

    <path d="M110,270 Q180,300 130,360 Q100,400 190,430 Q250,450 160,500" fill="none" stroke="#3f7d32" stroke-width="14" stroke-linecap="round" opacity="0.5"/>

    <use href="#lookout" x="210" y="420"/>
    <use href="#tuft" x="110" y="530"/>
    <use href="#tuft" x="300" y="540"/>
    <use href="#vine" transform="translate(90,260)"/>
    <use href="#vine" transform="translate(320,280)"/>

    <!-- signposts back toward Resort Core -->
    <text x="90" y="560" fill="#fde68a" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">inner path &#8592; Bungalow Row</text>
    <text x="90" y="278" fill="#fde68a" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">stone walk &#8592; Main Lodge</text>
  </g>

  <!-- ================= JUNGLE EDGE ================= -->
  <g>
    <path d="M356,176 L620,176 Q646,176 646,202 L646,524 Q646,550 620,550 L382,550 Q356,550 356,524 Z" fill="#123320" stroke="#0a2216" stroke-width="4"/>
    <rect x="376" y="200" width="220" height="56" rx="8" fill="#0f172a" opacity="0.6"/>
    <text x="390" y="224" fill="#f1f5f4" font-size="26" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Jungle Edge</text>
    <text x="390" y="246" fill="#a7d8b8" font-size="13" font-family="Georgia, 'Times New Roman', serif">dense brush &#8212; heavy cover</text>

    <use href="#canopy" transform="translate(420,340) scale(1.1)"/>
    <use href="#canopy" transform="translate(540,310) scale(0.9)"/>
    <use href="#canopy" transform="translate(460,450) scale(0.85)"/>
    <use href="#canopy" transform="translate(580,470) scale(1)"/>
    <use href="#vine" transform="translate(400,290)"/>
    <use href="#vine" transform="translate(600,300)"/>

    <text x="390" y="530" fill="#fde68a" font-size="13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">sand-to-brush &#8592; Beach Path</text>
  </g>

  <!-- ================= LIGHTHOUSE ================= -->
  <g>
    <path d="M646,202 L920,202 Q946,202 946,228 L946,524 Q946,550 920,550 L672,550 Q646,550 646,524 Z" fill="url(#rockGrad)" stroke="#292524" stroke-width="4"/>
    <path d="M660,540 L700,470 L740,520 L790,440 L840,530 L900,460 L930,540 Z" fill="#57534e" opacity="0.6"/>

    <!-- ridge trail arriving from Jungle Edge, drawn on top of the rock card -->
    <path d="M646,300 Q690,275 715,320 Q740,365 770,345" fill="none" stroke="#8a8478" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
    <path d="M646,300 Q690,275 715,320 Q740,365 770,345" fill="none" stroke="#d6d3cd" stroke-width="4" stroke-dasharray="10 8" opacity="0.6"/>
    <text x="690" y="195" text-anchor="middle" fill="#f1f5f4" font-size="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic">ridge trail &#8212; long climb</text>

    <rect x="666" y="216" width="220" height="56" rx="8" fill="#0f172a" opacity="0.6"/>
    <text x="680" y="240" fill="#f1f5f4" font-size="26" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Lighthouse</text>
    <text x="680" y="262" fill="#fecaca" font-size="13" font-family="Georgia, 'Times New Roman', serif">isolated ridge-top endpoint</text>

    <use href="#lighthouse" x="800" y="470"/>
    <path d="M800,284 L1000,240 L1000,320 L800,300 Z" fill="url(#beamGrad)" opacity="0.7"/>
  </g>

  <rect width="1000" height="650" fill="url(#vignette)"/>
</svg>
